name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 检查不阻断出包；项目暂无测试基础设施，lint 结果仅供参考。
  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 默认安装已下架的 legacy "tools" 包，会让 sdkmanager 以退出码 1 失败。
          packages: ''
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use official Gradle distribution on CI
        # 仓库 wrapper 指向腾讯云镜像（方便国内开发）；GitHub Runner 上改用官方源，仅修改 Runner 内的副本。
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew lintDebug
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 默认安装已下架的 legacy "tools" 包，会让 sdkmanager 以退出码 1 失败。
          packages: ''
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use official Gradle distribution on CI
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION_NAME"
      - name: Configure Android signing
        # 与 huaguoshan 一致：四个 ANDROID_KEY* Secrets 解码出固定 keystore，保证跨构建签名不变、可覆盖升级。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "$(printenv "$name")" ]; then
                echo "::error::$name 必须与 ANDROID_KEYSTORE_BASE64 一起配置"
                exit 1
              fi
            done
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "SIGNING_MODE=release-secrets" >> "$GITHUB_ENV"
            echo "已配置固定 Android 发布签名（GitHub Secrets）"
          else
            echo "SIGNING_MODE=ci-debug" >> "$GITHUB_ENV"
            echo "::warning::未配置 ANDROID_KEY* Secrets，回退临时 debug 签名；该产物无法覆盖升级"
          fi
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNING_MODE" = "release-secrets" ]; then
            KEYSTORE="$RUNNER_TEMP/release.jks"
            ALIAS="$ANDROID_KEY_ALIAS"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            echo "Signing with the fixed release keystore from Secrets"
          else
            KEYSTORE="$HOME/.android/debug.keystore"
            ALIAS=androiddebugkey
            STORE_PASS=android
            KEY_PASS=android
            if [ ! -f "$KEYSTORE" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -keystore "$KEYSTORE" -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "Signing with a throwaway CI keystore (no in-place upgrade)"
          fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/RXPlayer-v${VERSION}-debug.apk"
          "$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "dist/RXPlayer-v${VERSION}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "dist/RXPlayer-v${VERSION}-release.apk"
      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RXPlayer-v${{ steps.version.outputs.name }}-release
          path: dist/*-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RXPlayer-v${{ steps.version.outputs.name }}-debug
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          {
            echo "## RXPlayer v${{ steps.version.outputs.name }}"
            echo ""
            echo "Signing: $SIGNING_MODE"
            echo ""
            echo "| artifact | size |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
